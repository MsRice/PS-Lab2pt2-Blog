<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
   <main>
    <div class="containter">
      <div>
        <figure class="card__image--wrapper">
          <img src="./assets/images/illustration-article.svg" class="card__image" alt="Yellow, black, White geometric shapes">
        </figure>
      </div>
      <div class="card__info--wrapper">
        <div class="card__subject--wrapper">
          <h5 class="card__subject--title">Learning</h5>
        </div>
        <h5 class="card__publish-date">Published 21 Dec 2032</h5>
        <h3 class="card__header">HTML & CSS foundations</h3>
        <h3 class="card__para">These languages are the backbone of every website, defining structure, content, and presentation.</h3>
      </div>
      <div class="card__author--wrapper">
        <figure class="author__img--wrapper">
          <img src="./assets/images/image-avatar.webp" class="author__image" alt="Yellow, black, White geometric shapes">
        </figure>
        <h4 class="author__name">Greg Hooper</h4>
      </div>
      
    </div>
  </main>
</body>
</html>
